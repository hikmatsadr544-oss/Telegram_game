<!DOCTYPE html>
<html lang="kmr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Imperial Citadel</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #12131C;
            --card-bg: #1E202E;
            --accent-gold: #FFD700;
            --accent-orange: #FF8C00;
            --text-color: #FFFFFF;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .header {
            text-align: center;
            margin-top: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--accent-gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .stats-container {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            text-align: center;
        }

        .stat-title {
            font-size: 12px;
            color: #AAA;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-gold);
        }

        /* Castle Click Area */
        .castle-area {
            position: relative;
            margin: 20px 0;
            cursor: pointer;
        }

        .castle-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, #2C2D42 0%, #12131C 100%);
            border: 4px solid var(--accent-gold);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            transition: transform 0.1s ease;
        }

        .castle-btn:active {
            transform: scale(0.92);
        }

        /* Floating Click Numbers */
        .click-number {
            position: absolute;
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }

        /* Upgrades Section */
        .upgrades {
            width: 90%;
            max-width: 400px;
            margin-top: 10px;
        }

        .upgrade-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2A2C3D;
        }

        .upgrade-info h4 {
            margin: 0 0 5px 0;
            font-size: 15px;
        }

        .upgrade-info p {
            margin: 0;
            font-size: 12px;
            color: #888;
        }

        .buy-btn {
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange));
            border: none;
            color: #000;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .buy-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="user-name">🏰 Imperial Citadel</h1>
    </div>

    <div class="stats-container">
        <div class="stat-card">
            <div class="stat-title">زێڕ (Gold)</div>
            <div class="stat-value" id="gold-count">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">داهات / چرکە</div>
            <div class="stat-value" id="gps-count">0</div>
        </div>
    </div>

    <div class="castle-area" id="castle">
        <div class="castle-btn">🏰</div>
    </div>

    <div class="upgrades">
        <h3>بەرزکردنەوەی ئاست (Upgrades)</h3>
        
        <div class="upgrade-card">
            <div class="upgrade-info">
                <h4>وەستای مەعدەنچی ⛏️</h4>
                <p>داهات: +1 زێڕ/چرکە</p>
            </div>
            <button class="buy-btn" id="buy-miner" onclick="buyMiner()">کڕین (50 زێڕ)</button>
        </div>

        <div class="upgrade-card">
            <div class="upgrade-info">
                <h4>سوپاسالار ⚔️</h4>
                <p>داهات: +5 زێڕ/چرکە</p>
            </div>
            <button class="buy-btn" id="buy-knight" onclick="buyKnight()">کڕین (200 زێڕ)</button>
        </div>
    </div>

    <script>
        // Telegram WebApp Initialization
        const tg = window.Telegram.WebApp;
        tg.expand(); // Fullscreen mode in Telegram

        // Load User Info if available
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = "🏰 " + tg.initDataUnsafe.user.first_name + "'s Citadel";
        }

        // Game State
        let gold = parseInt(localStorage.getItem('gold')) || 0;
        let goldPerSecond = parseInt(localStorage.getItem('gps')) || 0;
        let minerCost = parseInt(localStorage.getItem('minerCost')) || 50;
        let knightCost = parseInt(localStorage.getItem('knightCost')) || 200;

        const goldEl = document.getElementById('gold-count');
        const gpsEl = document.getElementById('gps-count');
        const minerBtn = document.getElementById('buy-miner');
        const knightBtn = document.getElementById('buy-knight');
        const castle = document.getElementById('castle');

        function updateUI() {
            goldEl.innerText = Math.floor(gold);
            gpsEl.innerText = goldPerSecond;
            minerBtn.innerText = `کڕین (${minerCost} زێڕ)`;
            knightBtn.innerText = `کڕین (${knightCost} زێڕ)`;

            minerBtn.disabled = gold < minerCost;
            knightBtn.disabled = gold < knightCost;

            // Save state
            localStorage.setItem('gold', gold);
            localStorage.setItem('gps', goldPerSecond);
            localStorage.setItem('minerCost', minerCost);
            localStorage.setItem('knightCost', knightCost);
        }

        // Click Castle Effect & Earnings
        castle.addEventListener('click', (e) => {
            gold += 1;
            
            // Spawn Floating Number (+1)
            const num = document.createElement('div');
            num.className = 'click-number';
            num.innerText = '+1';
            num.style.left = `${e.clientX - castle.offsetLeft - 10}px`;
            num.style.top = `${e.clientY - castle.offsetTop - 20}px`;
            castle.appendChild(num);

            setTimeout(() => num.remove(), 800);
            updateUI();
        });

        // Passive Income (Per Second)
        setInterval(() => {
            if (goldPerSecond > 0) {
                gold += goldPerSecond;
                updateUI();
            }
        }, 1000);

        // Buy Functions
        function buyMiner() {
            if (gold >= minerCost) {
                gold -= minerCost;
                goldPerSecond += 1;
                minerCost = Math.floor(minerCost * 1.5);
                updateUI();
            }
        }

        function buyKnight() {
            if (gold >= knightCost) {
                gold -= knightCost;
                goldPerSecond += 5;
                knightCost = Math.floor(knightCost * 1.6);
                updateUI();
            }
        }

        updateUI();
    </script>
</body>
</html>
